  <script>
    var player;
    var LOOP_END = 9;

    /* ── Compute cover dimensions for 16:9 ── */
    function coverDims() {
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var ar = 16 / 9;
      if (vw / vh > ar) {
        return { w: vw, h: Math.ceil(vw / ar) };
      } else {
        return { w: Math.ceil(vh * ar), h: vh };
      }
    }

    /* ── Size iframe to always cover viewport ── */
    function sizePlayer() {
      var iframe = document.getElementById('player');
      if (!iframe) return;
      var d = coverDims();
      iframe.style.width  = d.w + 'px';
      iframe.style.height = d.h + 'px';
    }

    sizePlayer();
    window.addEventListener('resize', sizePlayer);

    /* ── YouTube IFrame API callback ── */
    /* Wrap the existing iframe (so its allow="autoplay" attribute is preserved) */
    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player(document.getElementById('player'), {
        events: {
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.ENDED) {
              player.seekTo(0, true);
              player.playVideo();
            }
          }
        }
      });
    };

    /* ── Load YouTube IFrame API ── */
    (function () {
      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    })();
  </script>

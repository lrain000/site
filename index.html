<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Rain – fata morgana</title>
  <link rel="icon" type="image/png" href="Assets/Images/icecube_favicon.png">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @font-face {
      font-family: 'EB Garamond';
      src: url('Assets/Fonts/EBGaramond.ttf') format('truetype');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Pastel fallback if WebGL is unavailable */
      background: linear-gradient(135deg, #f3c6d8 0%, #cdbfe8 40%, #b9c4ec 70%, #e7cdd6 100%);
    }

    /* ── Interactive shader background ── */
    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Ice texture layer (enlarged + blended over the haze) ── */
    #ice {
      display: none;              /* palette image is now the color source (in the shader) */
      position: fixed;
      inset: 0;
      z-index: 1;                 /* above the shader, below the wordmarks */
      background: url("Assets/Images/ochrestore_background_1.jpg") center center / cover no-repeat;
      mix-blend-mode: soft-light; /* soft frosted mottle textured into the haze */
      opacity: 0.4;               /* texture without washing the haze out */
      filter: saturate(0.6) contrast(1.05);  /* let some of the warm texture read */
      pointer-events: none;
      will-change: transform;
      transform: scale(2.05);     /* JS drives drift + cursor parallax on top of this */
    }

    /* ── Overlay (wordmarks + buttons) ── */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3vh;
      padding: 11vh 5vw;
      pointer-events: none;   /* let the mouse reach the shader */
    }

    .overlay a { pointer-events: auto; }

    .wm-top {
      width: min(78vw, 680px);
      max-height: 13vh;
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 26px rgba(80, 40, 90, 0.30));
    }

    /* cover + fata morgana + buttons stay grouped so the text reads as the album's */
    .center-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8vh;
    }

    .cover {
      width: min(42vw, 36vh, 440px);
      height: auto;
      display: block;
      border-radius: 3px;
      filter: drop-shadow(0 12px 48px rgba(40, 20, 40, 0.5));
    }

    .wm-bottom {
      width: min(52vw, 480px);
      max-height: 9vh;
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 26px rgba(80, 40, 90, 0.30));
    }

    .btn-group {
      display: flex;
      gap: 1rem;
    }

    .btn {
      display: inline-block;
      color: #fff;
      text-decoration: none;
      font-family: 'EB Garamond', Georgia, serif;
      font-size: clamp(1.05rem, 1.7vw, 1.35rem);
      letter-spacing: 0.03em;
      text-transform: lowercase;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
      opacity: 0.92;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 1;
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      padding: 1.6rem 0;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-family: 'EB Garamond', Georgia, serif;
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      letter-spacing: 0.03em;
      text-transform: lowercase;
      opacity: 0.92;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
      transition: opacity 0.2s;
    }

    nav a:hover {
      opacity: 1;
    }

    /* ── Social icons ── */
    .socials {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 1.8rem;
      padding: 1.6rem 0;
    }

    .socials a {
      display: flex;
      align-items: center;
      color: #fff;
      opacity: 0.85;
      filter: drop-shadow(0 1px 10px rgba(70, 40, 80, 0.45));
      transition: opacity 0.2s;
    }

    .socials a:hover {
      opacity: 1;
    }

    .socials svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>

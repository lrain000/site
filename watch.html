<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Rain – fata morgana – watch</title>
  <link rel="icon" type="image/png" href="Assets/Images/icecube_favicon.png">
  <link rel="stylesheet" href="Assets/css/modal.css">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @font-face {
      font-family: 'EB Garamond';
      src: url('Assets/Fonts/EBGaramond.ttf') format('truetype');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #f3c6d8 0%, #cdbfe8 40%, #b9c4ec 70%, #e7cdd6 100%);
    }

    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    #ice { display: none; }

    /* ── Overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12vh 5vw;
      pointer-events: none;
    }

    .overlay a,
    .overlay .video-wrap,
    .overlay iframe { pointer-events: auto; }

    .video-wrap {
      width: min(88vw, 900px, 108vh);
      aspect-ratio: 16 / 9;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 12px 48px rgba(40, 20, 40, 0.5);
      background: rgba(20, 10, 20, 0.4);
    }

    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;   /* evenly spread, spanning the wordmark width */
      width: min(80vw, 680px);
      margin: 0 auto;
      gap: 0.6rem 1rem;
      padding: 1.6rem 0;
    }

    @media (max-width: 640px) {
      nav {
        width: auto;
        justify-content: center;
        gap: 1rem 1.4rem;
        padding: 1.2rem 1rem;
      }
    }

    nav a,
    nav button,
    nav button.as-link {
      color: #fff;
      text-decoration: none;
      font-family: 'EB Garamond', Georgia, serif;
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      letter-spacing: 0.03em;
      text-transform: lowercase;
      opacity: 0.92;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: opacity 0.2s, border-color 0.2s;
    }

    nav a:hover,
    nav button:hover,
    nav button.as-link:hover,
    nav a[aria-current="page"] {
      opacity: 1;
      border-bottom-color: rgba(255, 255, 255, 0.7);
    }

    nav a:focus-visible,
    nav button:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.8);
      outline-offset: 3px;
    }

    /* ── Social icons ── */
    .socials {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 1.8rem;
      padding: 1.6rem 0;
    }

    .socials a {
      display: flex;
      align-items: center;
      color: #fff;
      opacity: 0.85;
      filter: drop-shadow(0 1px 10px rgba(70, 40, 80, 0.45));
      transition: opacity 0.2s;
    }

    .socials a:hover { opacity: 1; }

    .socials svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <!-- Meta Pixel (ID 537348656601210). Script is shared; the noscript
       fallback must be inline since it only renders without JS. -->
  <script src="Assets/js/meta-pixel.js"></script>
  <noscript><img height="1" width="1" style="display:none" alt=""
    src="https://www.facebook.com/tr?id=537348656601210&amp;ev=PageView&amp;noscript=1"></noscript>


  <canvas id="bg"></canvas>
  <div id="ice"></div>

  <nav>
    <a href="/shop">Shop</a>
    <a href="/tour">Tour</a>
    <a href="/watch" aria-current="page">Watch</a>
    <a href="http://lrain.ffm.to/fatamorgana" target="_blank">Listen</a>
    <a href="/newsletter">Newsletter</a>
  </nav>

  <div class="overlay">
    <div class="video-wrap">
      <iframe
        src="https://www.youtube.com/embed/PIJWnnQLVXA?list=PL8eVhMRcRoqBxJPZ7EffLU9MhjT0-Cmtw&rel=0&modestbranding=1"
        title="L'Rain – fata morgana videos"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </div>
  </div>

  <footer class="socials">
        <!-- rendered by content.js from content/social.json -->
      </footer>

  <!-- ── Newsletter modal (iframe injected on first open by modals.js) ── -->
  <div class="modal" id="modal-newsletter" hidden aria-hidden="true"
       role="dialog" aria-modal="true" aria-labelledby="nl-title">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-panel is-frame">
      <div class="modal-head">
        <h2 class="modal-title" id="nl-title">Newsletter</h2>
        <button type="button" class="modal-close" data-modal-close aria-label="Close">&times;</button>
      </div>
      <div class="modal-body is-frame"
           data-iframe-src="https://drop.cobrand.com/d/LRain/signup/embed?form_only=true"
           data-iframe-title="L'Rain newsletter signup"></div>
    </div>
  </div>

  <script src="Assets/js/background.js"></script>
  <script src="Assets/js/social-icons.js"></script>
  <script src="Assets/js/content.js"></script>
  <script src="Assets/js/modals.js"></script>

</body>
</html>

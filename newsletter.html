<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Rain – Newsletter</title>
  <link rel="icon" type="image/png" href="Assets/Images/icecube_favicon.png">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @font-face {
      font-family: 'EB Garamond';
      src: url('Assets/Fonts/EBGaramond.ttf') format('truetype');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: linear-gradient(135deg, #f3c6d8 0%, #cdbfe8 40%, #b9c4ec 70%, #e7cdd6 100%);
      font-family: 'EB Garamond', Georgia, serif;
      color: #fff;
    }

    body {
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Interactive shader background (shared with the other pages) ── */
    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;   /* evenly spread, spanning the wordmark width */
      width: min(80vw, 680px);
      margin: 0 auto;
      gap: 0.6rem 1rem;
      padding: 1.6rem 0;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-family: inherit;
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      letter-spacing: 0.03em;
      text-transform: lowercase;
      opacity: 0.92;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: opacity 0.2s, border-color 0.2s;
    }

    nav a:hover,
    nav a[aria-current="page"] {
      opacity: 1;
      border-bottom-color: rgba(255, 255, 255, 0.7);
    }

    nav a:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.8);
      outline-offset: 3px;
    }

    /* ── Page content ── */
    main {
      position: relative;
      z-index: 10;
      max-width: 620px;
      margin: 0 auto;
      padding: 7.5rem 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
    }

    .wm-top {
      width: min(78vw, 520px);
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 26px rgba(80, 40, 90, 0.30));
    }

    .page-title {
      font-size: clamp(1rem, 1.6vw, 1.15rem);
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      opacity: 0.75;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
    }

    /* ── Frosted panel hosting the signup form ── */
    .panel {
      width: 100%;
      background: rgba(38, 18, 42, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      backdrop-filter: blur(12px) saturate(1.1);
      -webkit-backdrop-filter: blur(12px) saturate(1.1);
      padding: 0.75rem;
      box-shadow: 0 10px 40px rgba(40, 20, 45, 0.22);
    }

    .nl-frame {
      width: 100%;
      height: min(70vh, 600px);
      border: 0;
      display: block;
      background: transparent;
    }

    /* ── Footer ── */
    .page-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      padding-top: 1rem;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 1.8rem;
    }

    .socials a {
      display: flex;
      align-items: center;
      color: #fff;
      opacity: 0.85;
      filter: drop-shadow(0 1px 10px rgba(70, 40, 80, 0.45));
      transition: opacity 0.2s;
    }

    .socials a:hover { opacity: 1; }

    .socials svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @media (max-width: 640px) {
      nav { width: auto; justify-content: center; padding: 1.2rem 1rem; gap: 1rem 1.4rem; }
      main { padding-top: 5.5rem; gap: 1.8rem; }
      .nl-frame { height: 78vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      #bg { display: none; }
    }
  </style>
</head>
<body>
  <!-- Meta Pixel (ID 537348656601210). Script is shared; the noscript
       fallback must be inline since it only renders without JS. -->
  <script src="Assets/js/meta-pixel.js"></script>
  <noscript><img height="1" width="1" style="display:none" alt=""
    src="https://www.facebook.com/tr?id=537348656601210&amp;ev=PageView&amp;noscript=1"></noscript>


  <canvas id="bg"></canvas>

  <nav>
    <a href="/shop">Shop</a>
    <a href="/tour">Tour</a>
    <a href="/watch">Watch</a>
    <a href="http://lrain.ffm.to/fatamorgana" target="_blank">Listen</a>
    <a href="/newsletter" aria-current="page">Newsletter</a>
  </nav>

  <main>
    <a href="/" aria-label="L'Rain — home">
      <img class="wm-top" src="Assets/Images/wordmark.png" alt="L'Rain">
    </a>

    <h1 class="page-title">Newsletter</h1>

    <div class="panel">
      <iframe
        class="nl-frame"
        src="https://drop.cobrand.com/d/LRain/signup/embed?form_only=true"
        title="L'Rain newsletter signup"
        loading="lazy"></iframe>
    </div>

    <footer class="page-footer">
      <div class="socials">
        <!-- rendered by content.js from content/social.json -->
      </div>
    </footer>
  </main>

  <script src="Assets/js/background.js"></script>
  <script src="Assets/js/social-icons.js"></script>
  <script src="Assets/js/content.js"></script>
  <script src="Assets/js/nav.js"></script>

</body>
</html>

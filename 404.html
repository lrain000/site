<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>L'Rain – Page Not Found</title>
  <!-- Cloudflare Pages serves this file for ANY unmatched URL, including deep
       ones like /foo/bar/baz. Relative paths would resolve against /foo/bar/
       and fail, so every path here is absolute — and this <base> makes the
       relative image lookups inside the shared background.js resolve from the
       root too, without having to change that shared file. -->
  <base href="/">
  <link rel="icon" type="image/png" href="/Assets/Images/icecube_favicon.png">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @font-face {
      font-family: 'EB Garamond';
      src: url('/Assets/Fonts/EBGaramond.ttf') format('truetype');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: linear-gradient(135deg, #f3c6d8 0%, #cdbfe8 40%, #b9c4ec 70%, #e7cdd6 100%);
      font-family: 'EB Garamond', Georgia, serif;
      color: #fff;
    }

    body {
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Interactive shader background (shared with the other pages) ── */
    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;   /* evenly spread, spanning the wordmark width */
      width: min(80vw, 680px);
      margin: 0 auto;
      gap: 0.6rem 1rem;
      padding: 1.6rem 0;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-family: inherit;
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      letter-spacing: 0.03em;
      text-transform: lowercase;
      opacity: 0.92;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: opacity 0.2s, border-color 0.2s;
    }

    nav a:hover {
      opacity: 1;
      border-bottom-color: rgba(255, 255, 255, 0.7);
    }

    nav a:focus-visible,
    main a:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.8);
      outline-offset: 3px;
    }

    /* ── Page content ── */
    main {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      max-width: 620px;
      margin: 0 auto;
      padding: 7.5rem 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.2rem;
    }

    .wm-top {
      width: min(78vw, 520px);
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 26px rgba(80, 40, 90, 0.30));
    }

    .page-title {
      font-size: clamp(1rem, 1.6vw, 1.15rem);
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      opacity: 0.75;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
    }

    .lost {
      font-size: clamp(1.05rem, 1.7vw, 1.3rem);
      letter-spacing: 0.03em;
      line-height: 1.7;
      text-align: center;
      opacity: 0.9;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
    }

    .back-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.4rem;
    }

    .back-links a {
      color: #fff;
      text-decoration: none;
      font-size: clamp(1.05rem, 1.7vw, 1.35rem);
      letter-spacing: 0.03em;
      text-transform: lowercase;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
      opacity: 0.92;
      /* Transparent border reserves the underline so hovering doesn't shift the row */
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: opacity 0.2s, border-color 0.2s;
    }

    .back-links a:hover {
      opacity: 1;
      border-bottom-color: rgba(255, 255, 255, 0.7);
    }

    /* ── Footer ── */
    .socials {
      display: flex;
      justify-content: center;
      gap: 1.8rem;
      padding-top: 0.5rem;
    }

    .socials a {
      display: flex;
      align-items: center;
      color: #fff;
      opacity: 0.85;
      filter: drop-shadow(0 1px 10px rgba(70, 40, 80, 0.45));
      transition: opacity 0.2s;
    }

    .socials a:hover { opacity: 1; }

    .socials svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @media (max-width: 640px) {
      nav { width: auto; justify-content: center; padding: 1.2rem 1rem; gap: 1rem 1.4rem; }
      main { padding-top: 6.5rem; gap: 1.8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      #bg { display: none; }
    }
  </style>
</head>
<body>

    </footer>

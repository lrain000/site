<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Rain – Shop</title>
  <link rel="icon" type="image/png" href="Assets/Images/icecube_favicon.png">
  <link rel="stylesheet" href="Assets/css/ochre-widgets.css">
  <link rel="stylesheet" href="Assets/css/modal.css">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @font-face {
      font-family: 'EB Garamond';
      src: url('Assets/Fonts/EBGaramond.ttf') format('truetype');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      /* Pastel fallback if WebGL is unavailable */
      background: linear-gradient(135deg, #f3c6d8 0%, #cdbfe8 40%, #b9c4ec 70%, #e7cdd6 100%);
      font-family: 'EB Garamond', Georgia, serif;
      color: #fff;
    }

    body {
      /* unlike the homepage, the shop scrolls */
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Interactive shader background (shared with the homepage) ── */
    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;   /* evenly spread, spanning the wordmark width */
      width: min(80vw, 680px);
      margin: 0 auto;   /* centered; cart dock floats in its own corner */
      gap: 0.6rem 1rem;
      padding: 1.6rem 0;
    }

    /* Until the viewport is wide enough for the spread nav to clear the cart
       dock in the corner, keep the links centered so they don't collide. */
    @media (max-width: 1024px) {
      nav {
        width: auto;
        justify-content: center;
        gap: 1rem 1.4rem;
        padding: 1.6rem 1rem;
      }
    }

    nav a,
    nav button,
    /* .as-link (modal.css) resets border+padding at 0,0,1,1 — this
       out-specifies it so the newsletter button underlines too. */
    nav button.as-link {
      color: #fff;
      text-decoration: none;
      font-family: inherit;
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      letter-spacing: 0.03em;
      text-transform: lowercase;
      opacity: 0.92;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
      /* Transparent border reserves the underline's space so hovering only
         changes its colour and the row never shifts. */
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: opacity 0.2s, border-color 0.2s;
    }

    nav a:hover,
    nav button:hover,
    nav button.as-link:hover {
      opacity: 1;
      border-bottom-color: rgba(255, 255, 255, 0.7);
    }

    /* Current page keeps the underline permanently */
    nav a[aria-current="page"] {
      opacity: 1;
      border-bottom-color: rgba(255, 255, 255, 0.7);
    }

    /* ── Page content ── */
    main {
      position: relative;
      z-index: 10;
      max-width: 860px;
      margin: 0 auto;
      padding: 7.5rem 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3vh;   /* match the home page's wordmark ↔ cover spacing */
    }

    .wm-top {
      width: min(78vw, 680px);
      max-height: 13vh;
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 26px rgba(80, 40, 90, 0.30));
    }

    /* ── Featured release ── */
    .featured {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3.4vh;   /* match the home page's cover ↔ fata morgana spacing */
      width: 100%;
    }

    .cover {
      width: min(42vw, 40vh, 460px);
      height: auto;
      display: block;
      border-radius: 3px;
      filter: drop-shadow(0 12px 48px rgba(40, 20, 40, 0.5));
    }

    .wm-release {
      width: min(52vw, 480px);
      max-height: 9vh;
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 26px rgba(80, 40, 90, 0.30));
    }

    .release-note {
      font-size: clamp(0.95rem, 1.5vw, 1.1rem);
      letter-spacing: 0.04em;
      text-transform: lowercase;
      opacity: 0.9;
      text-align: center;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
    }

    /* ── Back catalogue ── */
    .catalogue {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2.25rem;
      margin-top: 2rem;   /* keep the section separated after tightening the main gap */
    }

    .section-heading {
      font-size: clamp(1rem, 1.6vw, 1.15rem);
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      opacity: 0.75;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
    }

    .release {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* Cover art sits beside the title so each back-catalogue release reads
       as an album rather than a bare list of formats. */
    .release-head {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .release-art {
      width: 74px;
      height: 74px;
      flex-shrink: 0;
      display: block;
      border-radius: 3px;
      object-fit: cover;
      filter: drop-shadow(0 6px 22px rgba(40, 20, 40, 0.45));
    }

    .release-title {
      font-size: clamp(1.15rem, 2vw, 1.45rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
    }

    /* ── Frosted panel that hosts each Ochre product list ── */
    .panel {
      background: rgba(38, 18, 42, 0.26);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      backdrop-filter: blur(12px) saturate(1.1);
      -webkit-backdrop-filter: blur(12px) saturate(1.1);
      padding: 0.35rem 1.1rem;
      box-shadow: 0 10px 40px rgba(40, 20, 45, 0.22);
    }

    /* ── Cart dock (fixed, top right) ── */
    .cart-dock {
      position: fixed;
      top: 1.15rem;
      right: 1.15rem;
      z-index: 40;
      width: min(92vw, 420px);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
      /* The dock box overlaps the nav; make it click-through so the nav links
         underneath stay clickable. Only the actual cart toggle and panel
         (re-enabled below) receive clicks — pointer-events inherits, so the
         empty container area passes them through. */
      pointer-events: none;
    }

    .cart-dock .ochre-cart-toggle,
    .cart-dock .ochre-cart { pointer-events: auto; }

    /* ── Fallback if the embed library is blocked (ad-blockers, offline) ── */
    #embed-fallback {
      display: none;
      text-align: center;
      line-height: 1.7;
    }

    #embed-fallback.show { display: block; }

    /* With the library blocked there is nothing to put in the panels, so
       drop them rather than leave four empty frosted boxes on the page. */
    body.embed-unavailable .panel,
    body.embed-unavailable .catalogue,
    body.embed-unavailable .cart-dock { display: none; }

    #embed-fallback a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── Footer ── */
    .page-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      padding-top: 1rem;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 1.8rem;
    }

    .socials a {
      display: flex;
      align-items: center;
      color: #fff;
      opacity: 0.85;
      filter: drop-shadow(0 1px 10px rgba(70, 40, 80, 0.45));
      transition: opacity 0.2s;
    }

    .socials a:hover { opacity: 1; }

    .socials svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .credit {
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      opacity: 0.55;
    }

    .credit a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* ── Small screens: dock the cart to the bottom, out of the nav's way ── */
    @media (max-width: 640px) {
      nav { width: auto; justify-content: center; padding: 1.2rem 1rem; gap: 1rem 1.4rem; }

      main { padding-top: 5.5rem; gap: 2.5rem; }

      .cart-dock {
        top: auto;
        bottom: 0.9rem;
        right: 0.9rem;
        left: 0.9rem;
        width: auto;
        align-items: stretch;
      }

      .cart-dock a.ochre-cart-toggle { text-align: center; }

      /* These need the .panel prefix for the same reason every rule in
         ochre-widgets.css does — the library's own sheet loads later and
         sets width:50% on the wrappers. */
      .panel li.ochre-product {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.55rem;
      }

      .panel .ochre-product-price-wrapper {
        width: 100%;
        justify-content: space-between;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #bg { display: none; }
    }
  </style>
</head>
<body>
  <!-- Meta Pixel (ID 537348656601210). Script is shared; the noscript
       fallback must be inline since it only renders without JS. -->
  <script src="Assets/js/meta-pixel.js"></script>
  <noscript><img height="1" width="1" style="display:none" alt=""
    src="https://www.facebook.com/tr?id=537348656601210&amp;ev=PageView&amp;noscript=1"></noscript>


  <canvas id="bg"></canvas>

  <nav>
    <a href="/shop" aria-current="page">Shop</a>
    <a href="/tour">Tour</a>
    <a href="/watch">Watch</a>
    <a href="http://lrain.ffm.to/fatamorgana" target="_blank">Listen</a>
    <a href="/newsletter">Newsletter</a>
  </nav>

  <!-- Cart widget. Must be present alongside the product lists for retail to work. -->
  <div class="cart-dock">
    <div class="ochre-cart-container"></div>
  </div>

  <main>
    <a href="/" aria-label="L'Rain — home">
      <img class="wm-top" src="Assets/Images/wordmark.png" alt="L'Rain">
    </a>

    <!-- Featured release and catalogue are rendered by content.js from
         content/shop.json, so the artist team controls what leads the page
         (including nothing, when off-cycle) without touching markup. -->
    <div id="shop-featured"></div>
    <div id="shop-catalogue"></div>

    <p id="embed-fallback">
      The store couldn’t load — an ad-blocker or privacy extension may be blocking it.<br>
      Shop everything directly at <a href="https://lrain.ochre.store/" target="_blank" rel="noopener">lrain.ochre.store</a>.
    </p>

    <footer class="page-footer">
      <div class="socials">
        <!-- rendered by content.js from content/social.json -->
      </div>
      <p class="credit">
        Store powered by <a href="https://with-ochre.com" target="_blank" rel="noopener">Ochre</a>
      </p>
    </footer>
  </main>

  <!-- Newsletter signup. The iframe is declared, not written — modals.js
       injects it on first open so nothing loads from cobrand until asked. -->
  <div class="modal" id="modal-newsletter" hidden aria-hidden="true"
       role="dialog" aria-modal="true" aria-labelledby="nl-title-shop">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-panel is-frame">
      <div class="modal-head">
        <h2 class="modal-title" id="nl-title-shop">Newsletter</h2>
        <button type="button" class="modal-close" data-modal-close aria-label="Close">&times;</button>
      </div>
      <div class="modal-body is-frame"
           data-iframe-src="https://drop.cobrand.com/d/LRain/signup/embed?form_only=true"
           data-iframe-title="L'Rain newsletter signup"></div>
    </div>
  </div>

  <script src="Assets/js/background.js"></script>
  <script src="Assets/js/social-icons.js"></script>
  <script src="Assets/js/content.js"></script>
  <script src="Assets/js/modals.js"></script>
  <script src="Assets/js/nav.js"></script>

  <!-- Ochre embed library, served from the L'Rain store -->
  <script type="text/javascript" src="https://lrain.ochre.store/cart/embed/library"></script>


</body>
</html>

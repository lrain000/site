<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Rain – Shop</title>
  <link rel="icon" type="image/png" href="Assets/Images/icecube_favicon.png">
  <link rel="stylesheet" href="Assets/css/ochre-widgets.css">
  <link rel="stylesheet" href="Assets/css/modal.css">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @font-face {
      font-family: 'EB Garamond';
      src: url('Assets/Fonts/EBGaramond.ttf') format('truetype');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      /* Pastel fallback if WebGL is unavailable */
      background: linear-gradient(135deg, #f3c6d8 0%, #cdbfe8 40%, #b9c4ec 70%, #e7cdd6 100%);
      font-family: 'EB Garamond', Georgia, serif;
      color: #fff;
    }

    body {
      /* unlike the homepage, the shop scrolls */
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Interactive shader background (shared with the homepage) ── */
    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 2.5rem;
      padding: 1.6rem 6.5rem 1.6rem 1rem;   /* right padding clears the cart dock */
    }

    nav a,
    nav button,
    /* .as-link (modal.css) resets border+padding at 0,0,1,1 — this
       out-specifies it so the newsletter button underlines too. */
    nav button.as-link {
      color: #fff;
      text-decoration: none;
      font-family: inherit;
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      letter-spacing: 0.03em;
      text-transform: lowercase;
      opacity: 0.92;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
      /* Transparent border reserves the underline's space so hovering only
         changes its colour and the row never shifts. */
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: opacity 0.2s, border-color 0.2s;
    }

    nav a:hover,
    nav button:hover,
    nav button.as-link:hover {
      opacity: 1;
      border-bottom-color: rgba(255, 255, 255, 0.7);
    }

    /* Current page keeps the underline permanently */
    nav a[aria-current="page"] {
      opacity: 1;
      border-bottom-color: rgba(255, 255, 255, 0.7);
    }

    /* ── Page content ── */
    main {
      position: relative;
      z-index: 10;
      max-width: 860px;
      margin: 0 auto;
      padding: 7.5rem 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3.5rem;
    }

    .wm-top {
      width: min(78vw, 520px);
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 26px rgba(80, 40, 90, 0.30));
    }

    /* ── Featured release ── */
    .featured {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      width: 100%;
    }

    .cover {
      width: min(60vw, 300px);
      height: auto;
      display: block;
      border-radius: 3px;
      filter: drop-shadow(0 12px 48px rgba(40, 20, 40, 0.5));
    }

    .wm-release {
      width: min(52vw, 360px);
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 26px rgba(80, 40, 90, 0.30));
    }

    .release-note {
      font-size: clamp(0.95rem, 1.5vw, 1.1rem);
      letter-spacing: 0.04em;
      text-transform: lowercase;
      opacity: 0.9;
      text-align: center;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
    }

    /* ── Back catalogue ── */
    .catalogue {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2.25rem;
    }

    .section-heading {
      font-size: clamp(1rem, 1.6vw, 1.15rem);
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      opacity: 0.75;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
    }

    .release {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* Cover art sits beside the title so each back-catalogue release reads
       as an album rather than a bare list of formats. */
    .release-head {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .release-art {
      width: 74px;
      height: 74px;
      flex-shrink: 0;
      display: block;
      border-radius: 3px;
      object-fit: cover;
      filter: drop-shadow(0 6px 22px rgba(40, 20, 40, 0.45));
    }

    .release-title {
      font-size: clamp(1.15rem, 2vw, 1.45rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
    }

    /* ── Frosted panel that hosts each Ochre product list ── */
    .panel {
      background: rgba(38, 18, 42, 0.26);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      backdrop-filter: blur(12px) saturate(1.1);
      -webkit-backdrop-filter: blur(12px) saturate(1.1);
      padding: 0.35rem 1.1rem;
      box-shadow: 0 10px 40px rgba(40, 20, 45, 0.22);
    }

    /* ── Cart dock (fixed, top right) ── */
    .cart-dock {
      position: fixed;
      top: 1.15rem;
      right: 1.15rem;
      z-index: 40;
      width: min(92vw, 420px);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
    }

    /* ── Fallback if the embed library is blocked (ad-blockers, offline) ── */
    #embed-fallback {
      display: none;
      text-align: center;
      line-height: 1.7;
    }

    #embed-fallback.show { display: block; }

    /* With the library blocked there is nothing to put in the panels, so
       drop them rather than leave four empty frosted boxes on the page. */
    body.embed-unavailable .panel,
    body.embed-unavailable .catalogue,
    body.embed-unavailable .cart-dock { display: none; }

    #embed-fallback a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── Footer ── */
    .page-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      padding-top: 1rem;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 1.8rem;
    }

    .socials a {
      display: flex;
      align-items: center;
      color: #fff;
      opacity: 0.85;
      filter: drop-shadow(0 1px 10px rgba(70, 40, 80, 0.45));
      transition: opacity 0.2s;
    }

    .socials a:hover { opacity: 1; }

    .socials svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .credit {
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      opacity: 0.55;
    }

    .credit a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* ── Small screens: dock the cart to the bottom, out of the nav's way ── */
    @media (max-width: 640px) {
      nav { padding: 1.2rem 1rem; gap: 1.6rem; }

      main { padding-top: 5.5rem; gap: 2.5rem; }

      .cart-dock {
        top: auto;
        bottom: 0.9rem;
        right: 0.9rem;
        left: 0.9rem;
        width: auto;
        align-items: stretch;
      }

      .cart-dock a.ochre-cart-toggle { text-align: center; }

      /* These need the .panel prefix for the same reason every rule in
         ochre-widgets.css does — the library's own sheet loads later and
         sets width:50% on the wrappers. */
      .panel li.ochre-product {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.55rem;
      }

      .panel .ochre-product-price-wrapper {
        width: 100%;
        justify-content: space-between;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #bg { display: none; }
    }
  </style>
</head>
<body>

  <canvas id="bg"></canvas>

  <nav>
    <a href="tour.html">Tour</a>
    <button type="button" class="as-link" data-modal-open="modal-newsletter">Newsletter</button>
    <a href="shop.html" aria-current="page">Shop</a>
  </nav>

  <!-- Cart widget. Must be present alongside the product lists for retail to work. -->
  <div class="cart-dock">
    <div class="ochre-cart-container"></div>

  <main>
    <a href="index.html" aria-label="L'Rain — home">

    </section>

    <!-- ── Back catalogue ── -->
    <section class="catalogue" aria-labelledby="cat-heading">

      <div class="release">
        <div class="release-head">

               alt="L'Rain – I Killed Your Dog album cover" width="500" height="500">
          <h3 class="release-title">I Killed Your Dog</h3>
        </div>
        <div class="panel">
          <div class="ochre-list-ikyd"></div>
        </div>
      </div>

      <div class="release">
        <div class="release-head">
          <img class="release-art" src="Assets/Images/fatigue_cover.jpg"
               alt="L'Rain – Fatigue album cover" width="500" height="500">
          <h3 class="release-title">Fatigue</h3>
        </div>
        <div class="panel">
          <div class="ochre-list-fatigue"></div>
        </div>
      </div>
    </section>

    <p id="embed-fallback">
      The store couldn’t load — an ad-blocker or privacy extension may be blocking it.<br>
      Shop everything directly at <a href="https://lrain.ochre.store/" target="_blank" rel="noopener">lrain.ochre.store</a>.
    </p>

      </div>
      <p class="credit">
        Store powered by <a href="https://with-ochre.com" target="_blank" rel="noopener">Ochre</a>
      </p>
    </footer>
  </main>

  <!-- Newsletter signup. The iframe is declared, not written — modals.js
       injects it on first open so nothing loads from cobrand until asked. -->
  <div class="modal" id="modal-newsletter" hidden aria-hidden="true"
       role="dialog" aria-modal="true" aria-labelledby="nl-title-shop">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-panel is-frame">
      <div class="modal-head">
        <h2 class="modal-title" id="nl-title-shop">Newsletter</h2>
        <button type="button" class="modal-close" data-modal-close aria-label="Close">&times;</button>
      </div>
      <div class="modal-body is-frame"
           data-iframe-src="https://drop.cobrand.com/d/LRain/signup/embed?form_only=true"
           data-iframe-title="L'Rain newsletter signup"></div>
    </div>
  </div>

  <script src="Assets/js/background.js"></script>
  <script src="Assets/js/modals.js"></script>

  <!-- Ochre embed library, served from the L'Rain store -->
  <script type="text/javascript" src="https://lrain.ochre.store/cart/embed/library"></script>

  <script>
  (function () {
    // Product IDs are the store's release_format IDs prefixed with 20
    // (a track_format ID would take a 10 prefix instead).
    var LISTS = [
      ['.ochre-list-fatamorgana', [201989153, 201989152, 201989150, 201994028]],
      ['.ochre-list-ikyd',        [201369620, 201369624, 201369621, 201369622]],
      ['.ochre-list-fatigue',     [201298031, 201298032, 201298028, 201298029]]
    ];

    if (typeof window.buy === 'undefined') {
      document.getElementById('embed-fallback').className = 'show';
      document.body.className = 'embed-unavailable';
      return;
    }

    LISTS.forEach(function (entry) {
      try {
        buy.products(entry[0], { style: 'mini' }).get(entry[1]);
      } catch (e) {
        console.error('Ochre product list failed for ' + entry[0], e);
      }
    });

    buy.cart('.ochre-cart-container');
  })();
  </script>

</body>
</html>

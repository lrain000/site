<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Rain – Tour</title>
  <link rel="icon" type="image/png" href="Assets/Images/icecube_favicon.png">
  <link rel="stylesheet" href="Assets/css/modal.css">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @font-face {
      font-family: 'EB Garamond';
      src: url('Assets/Fonts/EBGaramond.ttf') format('truetype');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      /* Pastel fallback if WebGL is unavailable */
      background: linear-gradient(135deg, #f3c6d8 0%, #cdbfe8 40%, #b9c4ec 70%, #e7cdd6 100%);
      font-family: 'EB Garamond', Georgia, serif;
      color: #fff;
    }

    body {
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Interactive shader background (shared with the other pages) ── */
    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;   /* evenly spread, spanning the wordmark width */
      width: min(80vw, 680px);
      margin: 0 auto;
      gap: 0.6rem 1rem;
      padding: 1.6rem 0;
    }

    nav a,
    nav button,
    /* .as-link (modal.css) resets border+padding at 0,0,1,1 — this
       out-specifies it so the newsletter button underlines too. */
    nav button.as-link {
      color: #fff;
      text-decoration: none;
      font-family: inherit;
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      letter-spacing: 0.03em;
      text-transform: lowercase;
      opacity: 0.92;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
      /* Transparent border reserves the underline's space so hovering only
         changes its colour and the row never shifts. */
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: opacity 0.2s, border-color 0.2s;
    }

    nav a:hover,
    nav button:hover,
    nav button.as-link:hover {
      opacity: 1;
      border-bottom-color: rgba(255, 255, 255, 0.7);
    }

    /* Current page keeps the underline permanently */
    nav a[aria-current="page"] {
      opacity: 1;
      border-bottom-color: rgba(255, 255, 255, 0.7);
    }

    nav a:focus-visible,
    nav button:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.8);
      outline-offset: 3px;
    }

    /* ── Page content ── */
    main {
      position: relative;
      z-index: 10;
      /* Wider than the other pages: the Bandsintown widget switches to its
         stacked mobile layout when its CONTAINER (not the viewport) is
         narrower than data-layout-breakpoint. */
      max-width: 1040px;
      margin: 0 auto;
      padding: 7.5rem 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
    }

    .wm-top {
      width: min(78vw, 520px);
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 26px rgba(80, 40, 90, 0.30));
    }

    .page-title {
      font-size: clamp(1rem, 1.6vw, 1.15rem);
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      opacity: 0.75;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
    }

    /* ── Frosted panel hosting the Bandsintown widget ── */
    .panel {
      width: 100%;
      background: rgba(38, 18, 42, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      backdrop-filter: blur(12px) saturate(1.1);
      -webkit-backdrop-filter: blur(12px) saturate(1.1);
      padding: 0.5rem 1.25rem 1rem;
      box-shadow: 0 10px 40px rgba(40, 20, 45, 0.22);
    }

    /* ══════════════════════════════════════════════════════════
       Bandsintown widget styling.

       The widget renders inline into the page (no iframe, no shadow
       DOM) but injects its own ~244-rule stylesheet at runtime. That
       lands after this block, so it wins equal-specificity contests —
       every rule below is therefore scoped under .bit-scope to
       outrank its single-class selectors.

       Its data-* attributes only accept solid hex colours, so the
       transparent/Garamond treatment has to come from here.
       ══════════════════════════════════════════════════════════ */

    .bit-scope .bit-widget,
    .bit-scope .bit-widget-container,
    .bit-scope .bit-events-container,
    .bit-scope .bit-upcoming-events-container,
    .bit-scope .bit-event-lists {
      background: transparent;
      font-family: 'EB Garamond', Georgia, serif;
      color: #fff;
    }

    .bit-scope .bit-widget * {
      font-family: 'EB Garamond', Georgia, serif !important;
      border-color: rgba(255, 255, 255, 0.18);
    }

    /* Event rows: hairline dividers instead of the widget's grey blocks */
    .bit-scope .bit-event {
      background: transparent;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      padding: 0.85rem 0;
    }

    .bit-scope .bit-event:last-child { border-bottom: none; }

    .bit-scope .bit-event:hover { background: rgba(255, 255, 255, 0.04); }

    .bit-scope .bit-date,
    .bit-scope .bit-mobile-date {
      color: #fff;
      background: transparent;
      border: none;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      opacity: 0.85;
    }

    .bit-scope .bit-titleWrapper,
    .bit-scope .bit-venue {
      color: #fff;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
    }

    .bit-scope .bit-location-under-desktop,
    .bit-scope .bit-location-under-mobile {
      color: #fff;
      opacity: 0.7;
      font-size: 0.9rem;
    }

    .bit-scope .bit-event-list-title,
    .bit-scope .bit-nav-bar,
    .bit-scope .bit-nav-bar-container {
      color: #fff;
      background: transparent;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.8rem;
      opacity: 0.65;
    }

    /* All CTAs become the site's outline pills */
    .bit-scope .bit-button,
    .bit-scope .bit-multi-ticket-button,
    .bit-scope .bit-follow-section-cta,
    .bit-scope .bit-play-my-city-cta {
      color: #fff !important;
      background: transparent !important;
      border: 1px solid rgba(255, 255, 255, 0.55) !important;
      border-radius: 100px !important;
      padding: 0.38rem 1.05rem !important;
      font-size: 0.9rem !important;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      box-shadow: none !important;
      transition: background 0.2s, border-color 0.2s;
    }

    .bit-scope .bit-button:hover,
    .bit-scope .bit-multi-ticket-button:hover,
    .bit-scope .bit-follow-section-cta:hover,
    .bit-scope .bit-play-my-city-cta:hover {
      background: rgba(255, 255, 255, 0.16) !important;
      border-color: rgba(255, 255, 255, 0.85) !important;
    }

    /* The two prompt blocks read as quiet asides, not banners */
    .bit-scope .bit-follow-section-wrapper,
    .bit-scope .bit-play-my-city-wrapper {
      background: transparent;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      padding: 1.1rem 0 0.4rem;
      margin-top: 0.6rem;
    }

    .bit-scope .bit-follow-section-heading-text,
    .bit-scope .bit-play-my-city-heading-text {
      color: #fff;
      opacity: 0.75;
      font-size: 0.98rem;
      letter-spacing: 0.02em;
      margin-bottom: 0.6rem;
    }

    .bit-scope .bit-offers,
    .bit-scope .bit-offers-text,
    .bit-scope .bit-rsvp,
    .bit-scope .bit-rsvp-text,
    .bit-scope .bit-details {
      color: #fff;
      background: transparent;
    }

    .bit-scope .bit-logo-link { opacity: 0.5; }
    .bit-scope .bit-logo-link:hover { opacity: 0.85; }

    /* While the widget is fetching, and if it never arrives */
    #tour-status {
      padding: 1.5rem 0.5rem;
      text-align: center;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      opacity: 0.7;
    }

    #tour-status a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── Footer ── */
    .page-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      padding-top: 1rem;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 1.8rem;
    }

    .socials a {
      display: flex;
      align-items: center;
      color: #fff;
      opacity: 0.85;
      filter: drop-shadow(0 1px 10px rgba(70, 40, 80, 0.45));
      transition: opacity 0.2s;
    }

    .socials a:hover { opacity: 1; }

    .socials svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @media (max-width: 640px) {
      nav { width: auto; justify-content: center; padding: 1.2rem 1rem; gap: 1rem 1.4rem; }
      main { padding-top: 5.5rem; gap: 1.8rem; }
      .panel { padding: 0.5rem 0.85rem 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      #bg { display: none; }
    }
  </style>
</head>

  <!-- Bandsintown widget -->
  <script charset="utf-8" src="https://widgetv3.bandsintown.com/main.min.js"></script>

  <script>
  (function () {
    // The widget replaces its initializer anchor with the event list. Watch for
    // that so the loading line can be swapped for a real message if it never
    // arrives (blocked script, no dates listed).
    var status = document.getElementById('tour-status');
    var scope  = document.querySelector('.bit-scope');
    var tries  = 0;

    var poll = setInterval(function () {
      tries++;
      if (scope.querySelector('.bit-event, .bit-widget')) {
        status.remove();
        clearInterval(poll);
      } else if (tries > 20) {          // ~10s
        status.innerHTML = 'Tour dates couldn’t load here — see them on ' +
          '<a href="https://www.bandsintown.com/a/14715635-l%27rain" target="_blank" rel="noopener">Bandsintown</a>.';
        clearInterval(poll);
      }
    }, 500);
  })();
  </script>

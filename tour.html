<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Rain – Tour</title>
  <link rel="icon" type="image/png" href="Assets/Images/icecube_favicon.png">
  <link rel="stylesheet" href="Assets/css/modal.css">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @font-face {
      font-family: 'EB Garamond';
      src: url('Assets/Fonts/EBGaramond.ttf') format('truetype');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      /* Pastel fallback if WebGL is unavailable */
      background: linear-gradient(135deg, #f3c6d8 0%, #cdbfe8 40%, #b9c4ec 70%, #e7cdd6 100%);
      font-family: 'EB Garamond', Georgia, serif;
      color: #fff;
    }

    body {
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Interactive shader background (shared with the other pages) ── */
    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;   /* evenly spread, spanning the wordmark width */
      width: min(80vw, 680px);
      margin: 0 auto;
      gap: 0.6rem 1rem;
      padding: 1.6rem 0;
    }

    nav a,
    nav button,
    /* .as-link (modal.css) resets border+padding at 0,0,1,1 — this
       out-specifies it so the newsletter button underlines too. */
    nav button.as-link {
      color: #fff;
      text-decoration: none;
      font-family: inherit;
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      letter-spacing: 0.03em;
      text-transform: lowercase;
      opacity: 0.92;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
      /* Transparent border reserves the underline's space so hovering only
         changes its colour and the row never shifts. */
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: opacity 0.2s, border-color 0.2s;
    }

    nav a:hover,
    nav button:hover,
    nav button.as-link:hover {
      opacity: 1;
      border-bottom-color: rgba(255, 255, 255, 0.7);
    }

    /* Current page keeps the underline permanently */
    nav a[aria-current="page"] {
      opacity: 1;
      border-bottom-color: rgba(255, 255, 255, 0.7);
    }

    nav a:focus-visible,
    nav button:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.8);
      outline-offset: 3px;
    }

    /* ── Page content ── */
    main {
      position: relative;
      z-index: 10;
      max-width: 900px;
      margin: 0 auto;
      padding: 7.5rem 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
    }

    .wm-top {
      width: min(78vw, 520px);
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 26px rgba(80, 40, 90, 0.30));
    }

    .page-title {
      font-size: clamp(1rem, 1.6vw, 1.15rem);
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      opacity: 0.75;
      text-shadow: 0 1px 14px rgba(70, 40, 80, 0.45);
    }

    /* ── Frosted panel hosting the Bandsintown widget ── */
    .panel {
      width: 100%;
      background: rgba(38, 18, 42, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      backdrop-filter: blur(12px) saturate(1.1);
      -webkit-backdrop-filter: blur(12px) saturate(1.1);
      padding: 0.5rem 1.25rem 1rem;
      box-shadow: 0 10px 40px rgba(40, 20, 45, 0.22);
    }

    /* ══════════════════════════════════════════════════════════
       Seated widget styling.

       Renders inline (no iframe, no shadow DOM), so it is fully
       styleable. It loads its own external stylesheet at runtime
       (widget.seated.com/app-v3.css, per data-css-version="3"), which
       lands after this block and therefore wins equal-specificity
       contests. Every rule below is scoped under .seated-scope so the
       extra class outranks its single-class selectors.

       Its defaults are black system-ui text with white filled buttons.
       ══════════════════════════════════════════════════════════ */

    .seated-scope .seated-events-table,
    .seated-scope .seated-event-row,
    .seated-scope .seated-event-description-cells,
    .seated-scope .seated-event-date-cell,
    .seated-scope .seated-event-venue-cell,
    .seated-scope .seated-event-venue-name,
    .seated-scope .seated-event-venue-location,
    .seated-scope .seated-event-details-cell {
      background: transparent;
      color: #fff;
      font-family: 'EB Garamond', Georgia, serif;
    }

    .seated-scope .seated-event-row {
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      padding: 0.9rem 0;
      transition: background 0.2s;
    }

    .seated-scope .seated-event-row:last-child { border-bottom: none; }
    .seated-scope .seated-event-row:hover { background: rgba(255, 255, 255, 0.04); }

    .seated-scope .seated-event-date-cell {
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      opacity: 0.85;
    }

    .seated-scope .seated-event-venue-name {
      font-size: 1.05rem;
      letter-spacing: 0.02em;
    }

    .seated-scope .seated-event-venue-location,
    .seated-scope .seated-event-details-cell {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    /* Ticket links become the site's outline pills instead of filled
       white blocks. Both class names are targeted — the widget puts
       .seated-event-link and .seated-event-link1 on the same anchor. */
    .seated-scope a.seated-event-link,
    .seated-scope a.seated-event-link1 {
      color: #fff;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 100px;
      padding: 0.38rem 1.05rem;
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: none;
      transition: background 0.2s, border-color 0.2s;
      /* Seated's stylesheet forces uppercase with !important on this one
         property — every other declaration here applies normally, so this
         is the only place that needs to outrank it. The site sets its
         labels lowercase everywhere else. */
      text-transform: lowercase !important;
    }

    .seated-scope a.seated-event-link:hover,
    .seated-scope a.seated-event-link1:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.85);
    }

    /* While the widget is fetching, and if it never arrives */
    #tour-status {
      padding: 1.5rem 0.5rem;
      text-align: center;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      opacity: 0.7;
    }

    #tour-status a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── Footer ── */
    .page-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      padding-top: 1rem;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 1.8rem;
    }

    .socials a {
      display: flex;
      align-items: center;
      color: #fff;
      opacity: 0.85;
      filter: drop-shadow(0 1px 10px rgba(70, 40, 80, 0.45));
      transition: opacity 0.2s;
    }

    .socials a:hover { opacity: 1; }

    .socials svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @media (max-width: 640px) {
      nav { width: auto; justify-content: center; padding: 1.2rem 1rem; gap: 1rem 1.4rem; }
      main { padding-top: 5.5rem; gap: 1.8rem; }
      .panel { padding: 0.5rem 0.85rem 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      #bg { display: none; }
    }
  </style>
</head>
<body>
  <!-- Meta Pixel (ID 537348656601210). Script is shared; the noscript
       fallback must be inline since it only renders without JS. -->
  <script src="Assets/js/meta-pixel.js"></script>
  <noscript><img height="1" width="1" style="display:none" alt=""
    src="https://www.facebook.com/tr?id=537348656601210&amp;ev=PageView&amp;noscript=1"></noscript>


  <canvas id="bg"></canvas>

  <nav>
    <a href="/shop">Shop</a>
    <a href="/tour" aria-current="page">Tour</a>
    <a href="/watch">Watch</a>
    <a href="http://lrain.ffm.to/fatamorgana" target="_blank">Listen</a>
    <a href="/newsletter">Newsletter</a>
  </nav>

  <main>
    <a href="/" aria-label="L'Rain — home">
      <img class="wm-top" src="Assets/Images/wordmark.png" alt="L'Rain">
    </a>

    <h1 class="page-title">Tour Dates</h1>

    <div class="panel">
      <div class="seated-scope">
        <p id="tour-status">Loading tour dates&hellip;</p>

        <div id="seated-55fdf2c0"
             data-artist-id="f4c930c4-e92a-4555-ba02-3d8638dfbff8"
             data-css-version="3"></div>
      </div>
    </div>

    <footer class="page-footer">
      <div class="socials">
        <!-- rendered by content.js from content/social.json -->
      </div>
    </footer>
  </main>

  <!-- ── Newsletter modal (iframe injected on first open by modals.js) ── -->
  <div class="modal" id="modal-newsletter" hidden aria-hidden="true"
       role="dialog" aria-modal="true" aria-labelledby="nl-title-tour">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-panel is-frame">
      <div class="modal-head">
        <h2 class="modal-title" id="nl-title-tour">Newsletter</h2>
        <button type="button" class="modal-close" data-modal-close aria-label="Close">&times;</button>
      </div>
      <div class="modal-body is-frame"
           data-iframe-src="https://drop.cobrand.com/d/LRain/signup/embed?form_only=true"
           data-iframe-title="L'Rain newsletter signup"></div>
    </div>
  </div>

  <script src="Assets/js/background.js"></script>
  <script src="Assets/js/social-icons.js"></script>
  <script src="Assets/js/content.js"></script>
  <script src="Assets/js/modals.js"></script>
  <script src="Assets/js/nav.js"></script>

  <!-- Seated widget -->
  <script src="https://widget.seated.com/app.js"></script>

  <script>
  (function () {
    // The widget replaces its initializer anchor with the event list. Watch for
    // that so the loading line can be swapped for a real message if it never
    // arrives (blocked script, no dates listed).
    var status = document.getElementById('tour-status');
    var scope  = document.querySelector('.seated-scope');
    var tries  = 0;

    var poll = setInterval(function () {
      tries++;
      if (scope.querySelector('.seated-event-row')) {
        status.remove();
        clearInterval(poll);
      } else if (tries > 20) {          // ~10s
        status.innerHTML = 'Tour dates couldn’t load here — see them on ' +
          '<a href="https://www.bandsintown.com/a/14715635-l%27rain" target="_blank" rel="noopener">Bandsintown</a>.';
        clearInterval(poll);
      }
    }, 500);
  })();
  </script>

</body>
</html>
